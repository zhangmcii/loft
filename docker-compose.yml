services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: loft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-1234}
      MYSQL_DATABASE: loft_prod
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --innodb-log-buffer-size=16M
      - --innodb-log-file-size=64M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-file-per-table=1
      - --innodb-open-files=400
      - --innodb-io-capacity=200
      - --innodb-io-capacity-max=2000
      - --innodb-flush-method=O_DIRECT
      - --innodb-doublewrite=0
      - --innodb-log-files-in-group=2
      - --skip-name-resolve
      - --max-connections=200
      - --table-open-cache=2000
      - --thread-cache-size=50
      - --sort-buffer-size=2M
      - --read-buffer-size=128K
      - --read-rnd-buffer-size=256K
      - --join-buffer-size=256K
      - --tmp-table-size=64M
      - --max-heap-table-size=64M
    volumes:
      - ./data/mysql/data:/var/lib/mysql
      - ./data/mysql/logs:/var/log/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf:ro
    ports:
      - "3307:3306"
    networks:
      - loft-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: loft-redis
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./data/redis/data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    ports:
      - "6380:6379"
    networks:
      - loft-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Flask 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loft-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - FLASK_APP=flasky.py
      - FLASK_CONFIG=docker
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FLASKY_ADMIN_MAIL=${FLASKY_ADMIN_MAIL}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      - QINIU_ACCESS_KEY=${QINIU_ACCESS_KEY}
      - QINIU_SECRET_KEY=${QINIU_SECRET_KEY}
      - QINIU_BUCKET_NAME=${QINIU_BUCKET_NAME}
      - QINIU_DOMAIN=${QINIU_DOMAIN}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - QQ_CLIENT_ID=${QQ_CLIENT_ID}
      - QQ_CLIENT_SECRET=${QQ_CLIENT_SECRET}
      - WEIBO_CLIENT_ID=${WEIBO_CLIENT_ID}
      - WEIBO_CLIENT_SECRET=${WEIBO_CLIENT_SECRET}
      - REDIS_HOST=redis
      - RUN_APP=True
    volumes:
      - ./backend/app:/home/flasky/app:ro
      - ./backend/logs:/home/flasky/logs
      - ./data/uploads:/home/flasky/uploads
    ports:
      - "5000:5000"
    networks:
      - loft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Nginx 反向代理服务
  nginx:
    image: nginx:alpine
    container_name: loft-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./data/nginx/logs:/var/log/nginx
      - ./data/ssl:/etc/nginx/ssl:ro
    networks:
      - loft-network

  # Celery Worker（异步任务）
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loft-celery
    restart: unless-stopped
    command: /home/flasky/venv/bin/celery -A flasky.celery worker --loglevel=info --pool=threads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - FLASK_CONFIG=docker
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - QINIU_ACCESS_KEY=${QINIU_ACCESS_KEY}
      - QINIU_SECRET_KEY=${QINIU_SECRET_KEY}
      - QINIU_BUCKET_NAME=${QINIU_BUCKET_NAME}
      - QINIU_DOMAIN=${QINIU_DOMAIN}
      - REDIS_HOST=redis
      - RUN_APP=True
    volumes:
      - ./backend:/home/flasky:ro
    networks:
      - loft-network

  # Celery Beat（定时任务调度器）
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loft-celery-beat
    restart: unless-stopped
    command: /home/flasky/venv/bin/celery -A flasky.celery beat --loglevel=info
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - FLASK_CONFIG=docker
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=redis
      - RUN_APP=True
    volumes:
      - ./backend:/home/flasky:ro
    networks:
      - loft-network

# 数据卷配置
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# 网络配置
networks:
  loft-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
